<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa_logo_outer_bg_removed.png" alt="NASA Logo" class="logo" />
      <div class="title-row">
        <img src="img/nasa-worm-logo.png" alt="NASA worm logo" class="logo" />
        <h1>Space Explorer</h1>
      </div>
    </header>

    <div class="filters">
      <input type="date" id="startDate" />
      <input type="date" id="endDate" />
      <button id="getImagesButton" type="button">Get Space Images</button>
    </div>

    <section class="space-fact" aria-labelledby="spaceFactTitle">
      <h2 id="spaceFactTitle">Did You Know?</h2>
      <p id="spaceFact"></p>
    </section>

    <div id="gallery" class="gallery" aria-live="polite">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <dialog id="imageModal" class="image-modal" aria-labelledby="modalTitle">
    <button id="closeModalButton" class="modal-close" type="button" aria-label="Close image details">&times;</button>
    <div id="modalContent"></div>
  </dialog>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
